name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Liquid Glass (`glassEffect`) needs the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Test
        run: swift test
      - name: Build app
        run: scripts/build-app.sh
